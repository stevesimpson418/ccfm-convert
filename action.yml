name: "CCFM Deploy"
description: "Deploy Markdown to Confluence Cloud as native ADF pages"
author: "stevesimpson418"

branding:
  icon: "upload-cloud"
  color: "blue"

inputs:
  domain:
    description: "Confluence domain (e.g. company.atlassian.net)"
    required: true
  email:
    description: "Atlassian user email address"
    required: true
  token:
    description: "Atlassian API token"
    required: true
  space:
    description: "Confluence space key (e.g. DOCS)"
    required: true
  args:
    description: "ccfm subcommand and arguments (e.g. plan, apply --auto-approve)"
    required: false
    default: ""
  version:
    description: "ccfm-convert PyPI version to install"
    required: false
    default: "0.5.0"

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install ccfm-convert
      run: pip install ccfm-convert==${{ inputs.version }}
      shell: bash

    - name: Deploy to Confluence
      run: |
        ccfm \
          --domain "${{ inputs.domain }}" \
          --email  "${{ inputs.email }}" \
          --token  "${{ inputs.token }}" \
          --space  "${{ inputs.space }}" \
          ${{ inputs.args }}
      shell: bash
