site_name: CCFM — Confluence Cloud Flavoured Markdown
site_url: https://stevesimpson418.github.io/ccfm-convert/
site_description: >-
  A CLI tool that converts Markdown to Atlassian Document Format (ADF)
  and deploys pages to Confluence Cloud.
repo_url: https://github.com/stevesimpson418/ccfm-convert
repo_name: stevesimpson418/ccfm-convert
edit_uri: edit/main/docs/

theme:
  name: material
  logo: assets/logo.png
  favicon: assets/logo.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - content.code.copy
    - content.tabs.link
    - navigation.instant
    - navigation.instant.progress
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - toc.follow

nav:
  - Home: index.md
  - Syntax Reference: syntax-reference.md
  - CLI Reference: cli-reference.md
  - Configuration: configuration.md
  - Deployment Patterns: deployment-patterns.md
  - Docker & CI/CD: docker.md
  - Architecture: architecture.md
  - Troubleshooting: troubleshooting.md
  - Markdownlint Config: markdownlint.md
  - Changelog: changelog.md

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

plugins:
  - search
