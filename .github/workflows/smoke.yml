name: Smoke Tests

# Automated: runs on PRs and pushes to main (path-filtered, always cleans up)
# Manual:    run from Actions tab with choice of mode (see workflow_dispatch below)

on:
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "tests/smoke/**"
      - "action.yml"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/smoke/**"
      - "action.yml"
  workflow_dispatch:
    inputs:
      mode:
        description: >
          Run mode:
          'test-and-cleanup'  — deploy pages, run assertions, then delete pages (default),
          'test-no-cleanup'   — deploy and assert, leave pages in Confluence for inspection,
          'cleanup-only'      — skip tests, just delete pages left from a previous no-cleanup run.
        type: choice
        default: test-and-cleanup
        options:
          - test-and-cleanup
          - test-no-cleanup
          - cleanup-only

jobs:
  smoke:
    name: Smoke Tests (CCFMDEV)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and test dependencies
        run: pip install -e . -r requirements-test.txt

      - name: Run smoke tests
        env:
          CONFLUENCE_DOMAIN: ${{ secrets.CONFLUENCE_DOMAIN }}
          CONFLUENCE_EMAIL: ${{ secrets.CONFLUENCE_EMAIL }}
          CONFLUENCE_TOKEN: ${{ secrets.CONFLUENCE_TOKEN }}
        run: |
          # Automated triggers (PR / push) always clean up — no user input available
          MODE="${{ github.event.inputs.mode }}"
          if [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            MODE="test-and-cleanup"
          fi

          case "$MODE" in
            test-no-cleanup)  FLAGS="--no-cleanup" ;;
            cleanup-only)     FLAGS="--cleanup-only" ;;
            *)                FLAGS="" ;;  # test-and-cleanup (default)
          esac

          pytest tests/smoke/ --no-cov -v $FLAGS
