name: Smoke Tests

# Automated: runs on PRs and pushes to main (skips if no relevant files changed)
# Manual:    run from Actions tab with choice of mode (see workflow_dispatch below)

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: >
          Run mode:
          'test-and-cleanup'  — deploy pages, run assertions, then delete pages (default),
          'test-no-cleanup'   — deploy and assert, leave pages in Confluence for inspection,
          'cleanup-only'      — skip tests, just delete pages left from a previous no-cleanup run.
        type: choice
        default: test-and-cleanup
        options:
          - test-and-cleanup
          - test-no-cleanup
          - cleanup-only

jobs:
  changes:
    name: Detect relevant changes
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.filter.outputs.should_run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for relevant file changes
        id: filter
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            BASE="${{ github.event.before }}"
          else
            BASE="${{ github.event.pull_request.base.sha }}"
          fi

          # Handle null/missing base SHA (first push, force-push, etc.)
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CHANGED=$(git diff --name-only "$BASE" HEAD -- 'src/' 'tests/smoke/' 'action.yml')
          if [ -n "$CHANGED" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

  smoke:
    name: Smoke Tests (CCFMDEV)
    needs: [changes]
    if: always() && (github.event_name == 'workflow_dispatch' || needs.changes.outputs.should_run == 'true')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and test dependencies
        run: pip install -e . -r requirements-test.txt

      - name: Run smoke tests
        env:
          CONFLUENCE_DOMAIN: ${{ secrets.CONFLUENCE_DOMAIN }}
          CONFLUENCE_EMAIL: ${{ secrets.CONFLUENCE_EMAIL }}
          CONFLUENCE_TOKEN: ${{ secrets.CONFLUENCE_TOKEN }}
        run: |
          # Automated triggers (PR / push) always clean up — no user input available
          MODE="${{ github.event.inputs.mode }}"
          if [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            MODE="test-and-cleanup"
          fi

          case "$MODE" in
            test-no-cleanup)  FLAGS="--no-cleanup" ;;
            cleanup-only)     FLAGS="--cleanup-only" ;;
            *)                FLAGS="" ;;  # test-and-cleanup (default)
          esac

          pytest tests/smoke/ --no-cov -v $FLAGS
