name: Bandit

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - '.github/workflows/bandit.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - '.github/workflows/bandit.yml'

jobs:
  bandit:
    name: Bandit Security Scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Bandit
        run: pip install bandit[sarif]

      - name: Run Bandit
        run: bandit -r src/ -f sarif -o bandit-results.sarif --severity-level medium || true

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: bandit-results.sarif
